name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, product/paid-starter-kit-preparation, qa/customer-e2e]
  pull_request:
    branches: [main, product/paid-starter-kit-preparation]

permissions:
  contents: read

jobs:
  validation:
    name: Clean install, security audit, lint, build and backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Reconcile root lockfile with manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible root dependency security fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --no-fund

      - name: Verify clean root installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit all root dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint all frontend and repository JavaScript
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser end-to-end tests
        run: npm run test:e2e

      - name: Reconcile backend lockfile with manifest
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible backend dependency security fixes
        continue-on-error: true
        working-directory: server
        run: npm audit fix --package-lock-only --no-fund

      - name: Verify clean backend installation
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit all backend dependencies
        continue-on-error: true
        working-directory: server
        run: npm audit --audit-level=high

      - name: Run backend unit tests
        working-directory: server
        run: npm test

      - name: Check backend JavaScript syntax
        working-directory: server
        run: node --check server.js && node --check app.js

      - name: Upload verified lockfiles for downstream review
        uses: actions/upload-artifact@v4
        with:
          name: techstore-pro-verified-lockfiles
          path: |
            package-lock.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce high-severity security gate after validation
        run: |
          root_status=0
          backend_status=0
          npm audit --audit-level=high || root_status=$?
          (cd server && npm audit --audit-level=high) || backend_status=$?
          if [ "$root_status" -ne 0 ] || [ "$backend_status" -ne 0 ]; then
            echo "Security gate remains blocked: root status=$root_status, backend status=$backend_status"
            exit 1
          fi

  notice-review:
    name: Isolated third-party notice collection (QA only)
    needs: [validation]
    if: github.ref == 'refs/heads/qa/customer-e2e' && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified lockfiles from validation
        uses: actions/download-artifact@v4
        with:
          name: techstore-pro-verified-lockfiles
          path: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install exact root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install exact backend dependencies
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Collect exact-version production dependency notices
        run: |
          set -o pipefail
          npm run notices:generate 2>&1 | tee notice-generation.log

      - name: Upload generated notice register for downstream commit
        uses: actions/upload-artifact@v4
        with:
          name: techstore-pro-generated-notices
          path: |
            THIRD-PARTY-NOTICES.md
            notice-generation.log
          if-no-files-found: error
          retention-days: 7

  commit-lockfiles:
    name: Commit verified lockfiles
    needs: [validation]
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/qa/customer-e2e' ||
       github.ref == 'refs/heads/product/paid-starter-kit-preparation') &&
      needs.validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download verified lockfiles
        uses: actions/download-artifact@v4
        with:
          name: techstore-pro-verified-lockfiles
          path: .

      - name: Commit lockfiles and push with race protection
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json

          if git diff --cached --quiet; then
            echo "Verified lockfiles already match manifests and security fixes."
            exit 0
          fi

          git commit -m "chore(deps): apply verified security updates"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

  commit-notices:
    name: Commit generated third-party notices (QA only)
    needs: [validation, notice-review, commit-lockfiles]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/qa/customer-e2e' &&
      needs.validation.result == 'success' &&
      needs.notice-review.result == 'success' &&
      needs.commit-lockfiles.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download generated notice register
        uses: actions/download-artifact@v4
        with:
          name: techstore-pro-generated-notices
          path: .

      - name: Commit notice register and push after lockfile commit
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD-PARTY-NOTICES.md

          if git diff --cached --quiet; then
            echo "Tracked notice register already matches exact-lockfile generation."
            exit 0
          fi

          git commit -m "docs(licenses): refresh generated third-party notices"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
