name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install reconciles the current root manifest/lockfile mismatch.
        run: npm install --no-audit --no-fund

      - name: Lint changed payment/order files
        run: >-
          npx eslint
          src/api/adminApi.js
          src/pages/admin/AdminOrders.jsx
          server/controllers/adminOrderLifecycleController.js
          server/routes/adminRoutes.js

      - name: Build
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: >-
          node --check server.js &&
          node --check app.js &&
          node --check controllers/orderController.js &&
          node --check controllers/paymentController.js &&
          node --check models/Order.js &&
          node --check middleware/csrfMiddleware.js &&
          node --check routes/paymentRoutes.js &&
          node --check services/paystackService.js &&
          node --check services/expirePendingCardOrders.js

      - name: Test Paystack signature validation
        run: npm test
