name: CI

on:
  push:
    branches: [main, product/paid-starter-kit-preparation]
  pull_request:
    branches: [main, product/paid-starter-kit-preparation]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile root lockfile with the manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean root installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload generated root lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techstore-pro-root-lockfile-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Lint all frontend and repository JavaScript
        run: npm run lint

      - name: Build
        if: always()
        run: npm run build

      - name: Commit verified root lockfile
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/product/paid-starter-kit-preparation'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Root lockfile already matches the manifest."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): reconcile root npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js && node --check app.js
