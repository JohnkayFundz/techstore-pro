name: CI

on:
  push:
    branches: [main, product/paid-starter-kit-preparation]
  pull_request:
    branches: [main, product/paid-starter-kit-preparation]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install is temporary until the root manifest and lockfile are reconciled.
        run: npm install --no-audit --no-fund

      - name: Lint all frontend and repository JavaScript
        run: npm run lint

      - name: Build
        if: always()
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js && node --check app.js
